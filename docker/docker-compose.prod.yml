# ============================================================
# 生产环境部署（预留：将来购买云服务器后使用，暂不运行）
#
# 部署步骤：
#   1. 服务器安装 Docker + Docker Compose
#   2. 把项目代码 git clone 到服务器
#   3. 在项目根目录：docker compose -f docker/docker-compose.prod.yml up -d --build
#   4. 用真实密码替换下面的默认值（或用环境变量注入）
# ============================================================

name: my-web-project-prod

services:
  # ---- 应用：Nginx + PHP-FPM ----
  php:
    build:
      context: ..
      dockerfile: docker/php.Dockerfile
    container_name: mwp-php
    restart: unless-stopped
    volumes:
      - ../runtime:/var/www/html/runtime
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: mwp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # ---- 基础设施（与开发环境一致）----
  mysql:
    image: mysql:8.0.36
    container_name: mwp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置数据库密码}
      MYSQL_DATABASE: my_web_project
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: mwp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请设置Redis密码}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mwp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mwp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请设置RabbitMQ密码}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # 生产环境管理端口 15672 不对公网开放，仅限本机访问
    ports:
      - "127.0.0.1:15672:15672"

  minio:
    image: minio/minio:latest
    container_name: mwp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mwpadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请设置MinIO密码}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
