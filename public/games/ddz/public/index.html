    <script>
    // ── 页面函数 ──
    function toggleFriendRoom() {
        document.getElementById('right').style.display = 'none';
        document.getElementById('friend-panel').style.display = 'block';
    }

    function toggleJoinRoom() {
        document.getElementById('inroom').style.display = 'block';
        document.getElementById('btn_inroom').style.display = 'block';
    }

    function createRoom() {
        window.location.href = DdzApi.baseUrl + 'createroom.php?n=1';
    }

    function joinRoom(e) {
        e.preventDefault();
        var roomId = document.getElementById('inroom').value.trim();
        if (!roomId) { alert('请输入房间号'); return; }
        window.location.href = DdzApi.baseUrl + 'api/room/?roomid=' + roomId;
    }

    // ── 加载玩家信息 ──
    $(function () {
        DdzApi.getMyProfile()
            .done(function (data) {
                if (data.code === 200) {
                    $('#player-name').text(data.name);
                    $('#player-jinbi').text(data.jinbi);
                    $('#player-hunyu').text(data.hunyu);
                    if (data.duanwei) {
                        $('#player-duanwei').css('background-image', 'url(' + data.duanwei + ')');
                    }
                    if (data.chengwei) {
                        $('#player-chengwei').css('background-image', 'url(' + data.chengwei + ')');
                    }
                    if (data.bglihui) {
                        $('#player-lihui').css('background-image', 'url(' + data.bglihui + ')');
                    }
                } else if (data.code === 401) {
                    window.location.href = 'login.html';
                }
            })
            .fail(function () {
                // 可能未登录，留在页面
            });
    });
    </script>
