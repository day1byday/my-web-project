<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>斗地主 | madmic</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery-1.8.3.min.js"></script>
    <script src="js/yinghua.js"></script>
    <script src="js/api.js"></script>
    <script src="js/poll.js"></script>
</head>
<body class="room-page">
    <!-- 背景 -->
    <div class="room-bg">
        <img src="img/bg/indoor.png" height="100%" width="100%">
    </div>

    <!-- 头部 -->
    <div class="room-header">
        <img src="img/ui/img_return1_bg.png" style="height:80px;">
        <a href="index.html"><img src="img/ui/img_return1.png" style="position:absolute;left:0;top:0;"></a>
        <img src="img/ui/txt_friendroom.png" style="position:absolute;left:8%;top:3.7%;width:140px;">
    </div>

    <!-- 3 个玩家位置 -->
    <div>
        <div id="slot-1" class="player-slot player-slot-1">
            <img src="img/ui/frame_gold.png">
            <img src="img/ui/character_bg.png">
            <div id="player1-content"></div>
        </div>
        <div id="slot-2" class="player-slot player-slot-2">
            <img src="img/ui/frame_gold.png">
            <img src="img/ui/character_bg.png">
            <div id="player2-content"></div>
        </div>
        <div id="slot-3" class="player-slot player-slot-3">
            <img src="img/ui/frame_gold.png">
            <img src="img/ui/character_bg.png">
            <div id="player3-content"></div>
        </div>
    </div>

    <!-- 房间信息 -->
    <div class="room-settings">
        <img src="img/ui/btn_choosen.png">
        <p id="room-type" style="z-index:1;position:absolute;left:83%;top:21.2%;font-size:25px;color:black;">斗地主</p>
        <img src="img/ui/btn_choosen.png" style="margin-top:10%;">
        <p id="room-reward" style="z-index:1;position:absolute;left:81.5%;top:31.2%;font-size:25px;color:black;"></p>
        <img src="img/ui/btn_choosen.png" style="margin-top:10%;">
        <p id="room-id-display" style="z-index:1;position:absolute;left:80.8%;top:42.2%;font-size:18px;color:black;">房号：--</p>
    </div>

    <!-- 添加电脑/装扮按钮 -->
    <div style="position:absolute;right:5%;top:55%;">
        <img src="img/ui/btn_small.png" style="width:180px;height:70px;">
        <p style="z-index:1;position:absolute;left:3%;top:0;font-size:25px;color:#ffae4c;">添加电脑</p>
        <img src="img/ui/btn_small.png" style="width:180px;height:70px;margin-top:10%;">
        <p style="z-index:1;position:absolute;left:3%;top:40%;font-size:25px;color:#ffae4c;">调整装扮</p>
    </div>

    <!-- 底部按钮区 -->
    <div id="bottom-action" class="room-bottom-btn"></div>

    <!-- Toast 提示 -->
    <div id="toast" class="error-toast"></div>

    <script>
    // ── 全局状态 ──
    var gState = {
        myId: 0,
        roomId: '',
        players: [0, 0, 0],   // [player1_id, player2_id, player3_id]
        prepare: [0, 0, 0]    // [ready1, ready2, ready3]
    };

    // ── 渲染玩家信息 ──
    function renderPlayer(slotIndex, playerData, isOwner, isReady) {
        var contentId = 'player' + (slotIndex + 1) + '-content';
        var container = document.getElementById(contentId);
        if (!container) return;

        var ownerBadge = isOwner ? '<img src="img/ui/roomowner.png" style="position:absolute;left:0.5%;top:1%;">' : '';
        var readyDisplay = isReady ? 'block' : 'none';
        var leftPos = ['14.5%', '35.5%', '56.5%'];
        var nameLeft = ['18%', '39%', '60%'];
        var starBase = ['12.7%', '33.7%', '54.7%'];
        var readyLeft = ['20%', '41%', '62%'];
        var chengweiLeft = ['19%', '40%', '61%'];

        var i = slotIndex;

        container.innerHTML =
            '<img src="' + (playerData.lihui || 'img/ui/character_bg.png') + '" style="position:absolute;left:' + leftPos[i] + ';top:16.5%;width:290px;">' +
            '<img src="img/ui/namebg.png" style="position:absolute;left:' + (parseFloat(leftPos[i]) - 1) + '%;top:72%;height:80px;">' +
            '<img src="' + (playerData.duanwei || '') + '" style="position:absolute;left:' + (parseFloat(leftPos[i]) - 1) + '%;top:72%;height:80px;">' +
            '<img src="img/ui/star_dark.png" style="position:absolute;left:' + starBase[i] + ';top:76%;height:25px;">' +
            '<img src="img/ui/star.png" style="position:absolute;left:' + (parseFloat(starBase[i]) + 0.8) + '%;top:78.1%;height:20px;">' +
            '<img src="img/ui/star.png" style="position:absolute;left:' + (parseFloat(starBase[i]) + 1.8) + '%;top:79.2%;height:15px;">' +
            '<img src="img/ui/ready.png" style="position:absolute;left:' + readyLeft[i] + ';top:58.5%;display:' + readyDisplay + ';" class="ready-indicator">' +
            '<img src="' + (playerData.chengwei || '') + '" style="position:absolute;left:' + chengweiLeft[i] + ';top:70%;height:40px;">' +
            '<p style="z-index:1;position:absolute;left:' + nameLeft[i] + ';top:71.6%;font-size:25px;color:white;">' + (playerData.name || '等待中...') + '</p>' +
            ownerBadge;
    }

    // ── 渲染空位 ──
    function renderEmptySlot(slotIndex) {
        var contentId = 'player' + (slotIndex + 1) + '-content';
        var container = document.getElementById(contentId);
        if (!container) return;
        container.innerHTML = '';
    }

    // ── 渲染底部按钮 ──
    function renderBottomButton() {
        var container = document.getElementById('bottom-action');
        var isOwner = (gState.players[0] == gState.myId);
        var allReady = gState.prepare[0] == 1 && gState.prepare[1] == 1 && gState.prepare[2] == 1;

        if (isOwner) {
            if (allReady) {
                container.innerHTML = '<img src="img/ui/btn_start.png" style="cursor:pointer;" onclick="beginGame()">';
            } else {
                container.innerHTML = '<img src="img/ui/btn_start_no.png">';
            }
        } else {
            var myIndex = gState.players.indexOf(gState.myId);
            var amReady = (myIndex >= 0 && gState.prepare[myIndex] == 1);
            if (!amReady) {
                container.innerHTML = '<img src="img/ui/btn_ready.png" style="cursor:pointer;" onclick="doReady()">';
            } else {
                container.innerHTML = '<img src="img/ui/btn_ready.png" style="opacity:0.5;">';
            }
        }
    }

    // ── 加载房间数据 ──
    function loadRoom() {
        // 从 URL 获取 roomId（或从 session）
        var roomId = getRoomIdFromUrl();
        if (!roomId) {
            // 尝试从第一个 API 调用获取
            loadRoomViaState();
            return;
        }
        gState.roomId = roomId;

        DdzApi.getRoom(roomId)
            .done(function (data) {
                if (data.code === 200) {
                    if (data.player) {
                        var p = typeof data.player === 'string' ? JSON.parse(data.player) : data.player;
                        gState.players = p;
                    }
                    if (data.prepare) {
                        var pr = typeof data.prepare === 'string' ? JSON.parse(data.prepare) : data.prepare;
                        gState.prepare = pr;
                    }
                    if (data.type) gState.type = data.type;
                    if (data.reward) gState.reward = data.reward;
                    updateRoomDisplay();
                    loadAllPlayers();
                } else if (data.code === 404) {
                    showToast('房间不存在');
                }
            })
            .fail(function () {
                // 可能未登录
            });
    }

    function loadRoomViaState() {
        // 通过 server.php 获取状态（含 roomId）
        DdzApi.pollRoom()
            .done(function (res) {
                // server.php 返回的状态包含 roomId 信息在 session 中
                loadRoom();
            });
    }

    function getRoomIdFromUrl() {
        var m = window.location.search.match(/roomid=(\d+)/);
        return m ? m[1] : null;
    }

    function updateRoomDisplay() {
        document.getElementById('room-type').textContent = gState.type || '斗地主';
        document.getElementById('room-reward').textContent = gState.reward || '';
        document.getElementById('room-id-display').textContent = '房号：' + gState.roomId;
    }

    // ── 加载所有玩家信息 ──
    function loadAllPlayers() {
        for (var i = 0; i < 3; i++) {
            if (gState.players[i] && gState.players[i] != 0) {
                loadPlayerInfo(i, gState.players[i]);
            } else {
                renderEmptySlot(i);
            }
        }
        renderBottomButton();
    }

    function loadPlayerInfo(slotIndex, playerId) {
        DdzApi.getPlayer(playerId)
            .done(function (data) {
                if (data.code === 200) {
                    var isOwner = (slotIndex === 0);
                    var isReady = gState.prepare[slotIndex] == 1;
                    renderPlayer(slotIndex, data, isOwner, isReady);
                    renderBottomButton();
                }
            });
    }

    // ── 操作 ──
    function doReady() {
        DdzApi.ready()
            .done(function (res) {
                if (res.code === 200) {
                    loadRoom();
                }
            });
    }

    function beginGame() {
        var playerIds = gState.players.filter(function (p) { return p && p != 0; });
        if (playerIds.length < 3) {
            showToast('人数不足，无法开始');
            return;
        }
        DdzApi.beginGame(playerIds, gState.roomId)
            .done(function (res) {
                if (res.code === 200) {
                    window.location.href = 'game.html?roomid=' + gState.roomId;
                }
            });
    }

    // ── 离开房间 ──
    window.onbeforeunload = function () {
        if (gState.roomId) {
            DdzApi.leaveRoom();
        }
    };

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(function () { t.style.display = 'none'; }, 2000);
    }

    // ── 轮询 ──
    function pollRoom() {
        DdzApi.pollRoom()
            .done(function (res) {
                if (res == -1) {
                    loadRoom(); // 状态变化，刷新
                } else if (res == 2) {
                    window.location.href = 'game.html?roomid=' + gState.roomId;
                }
            });
    }

    // ── 启动 ──
    $(function () {
        loadRoom();
        PollManager.start('room', pollRoom, 1000);
    });
    </script>
</body>
</html>
